name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --group dev --extra sm

      - name: Ruff
        run: uv run ruff check src tests

      - name: Mypy
        run: uv run mypy

      - name: Pytest
        env:
          AUSCULT_SPACY_MODEL: en_core_web_sm
        run: uv run pytest

      - name: PHI eval harness
        env:
          AUSCULT_SPACY_MODEL: en_core_web_sm
        run: uv run auscult --json eval --nlp-model en_core_web_sm
