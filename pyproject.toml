[project]
name = "auscult"
version = "0.1.0"
description = "Python SDK and CLI for PHI-safe observability and replay of healthcare AI agents"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12"
authors = [
	{ name = "Ruchir", email = "114174072+ruxir-ig@users.noreply.github.com" },
]
keywords = [
	"observability",
	"healthcare",
	"phi",
	"hipaa",
	"agents",
	"llm",
	"presidio",
	"replay",
	"tracing",
]
classifiers = [
	"Development Status :: 3 - Alpha",
	"Environment :: Console",
	"Intended Audience :: Developers",
	"License :: OSI Approved :: MIT License",
	"Programming Language :: Python :: 3",
	"Programming Language :: Python :: 3.12",
	"Programming Language :: Python :: 3.13",
	"Topic :: Scientific/Engineering :: Artificial Intelligence",
	"Topic :: Security",
	"Typing :: Typed",
]
dependencies = [
	"sqlalchemy>=2.0",
	"psycopg2-binary",
	"presidio-analyzer",
	"presidio-anonymizer",
	"faker",
	"spacy>=3.8,<4",
	"alembic>=1.18.4",
]

[project.optional-dependencies]
langchain = [
	"langchain-core>=0.3",
]

[project.urls]
Homepage = "https://github.com/ruxir-ig/auscult"
Repository = "https://github.com/ruxir-ig/auscult"
Issues = "https://github.com/ruxir-ig/auscult/issues"
Documentation = "https://github.com/ruxir-ig/auscult#readme"

[project.scripts]
auscult = "auscult.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/auscult"]

[tool.hatch.build.targets.sdist]
include = [
	"/src",
	"/tests",
	"/README.md",
	"/LICENSE",
	"/alembic.ini",
	"/migrate.py",
	"/pyproject.toml",
]

# spaCy models are not on PyPI. For local/uv source checkouts they are pulled
# via [tool.uv.sources] into dependency-groups. End users install models with
# `auscult setup` or `python -m spacy download en_core_web_lg` after
# `pip install` / `uv add`.
[dependency-groups]
dev = [
	"pytest>=9.0.3",
	"ruff>=0.14.0",
	"mypy>=1.18.0",
	# Fast spaCy model for CI/tests; production default remains en_core_web_lg.
	"en-core-web-sm",
	# Exercised by tests/test_integrations_langchain.py.
	"langchain-core>=0.3",
]
nlp = [
	"en-core-web-lg",
]
nlp-trf = [
	"en-core-web-trf",
]

[tool.uv.sources]
en-core-web-sm = { url = "https://github.com/explosion/spacy-models/releases/download/en_core_web_sm-3.8.0/en_core_web_sm-3.8.0-py3-none-any.whl" }
en-core-web-lg = { url = "https://github.com/explosion/spacy-models/releases/download/en_core_web_lg-3.8.0/en_core_web_lg-3.8.0-py3-none-any.whl" }
en-core-web-trf = { url = "https://github.com/explosion/spacy-models/releases/download/en_core_web_trf-3.8.0/en_core_web_trf-3.8.0-py3-none-any.whl" }

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]
extend-exclude = ["src/auscult/alembic"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
packages = ["auscult"]
mypy_path = "src"
strict = true
warn_return_any = true
warn_unused_configs = true
exclude = ["alembic/"]

[[tool.mypy.overrides]]
module = [
	"presidio_analyzer.*",
	"presidio_anonymizer.*",
	"faker.*",
]
ignore_missing_imports = true


[tool.pytest.ini_options]
testpaths = ["tests"]
