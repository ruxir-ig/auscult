[project]
name = "auscult"
version = "0.1.0"
description = "Passive observability and safe replay tool for healthcare AI agents"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
	"sqlalchemy>=2.0",
	"psycopg2-binary",
	"presidio-analyzer",
	"presidio-anonymizer",
	"faker",
	"en-core-web-lg",
	"alembic>=1.18.4",
]

[project.optional-dependencies]
sm = [
	"en-core-web-sm",
]
trf = [
	"en-core-web-trf",
]

[project.scripts]
auscult = "auscult.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/auscult"]

[tool.hatch.build.targets.wheel.force-include]
"src/auscult/data/phi_eval_corpus.jsonl" = "auscult/data/phi_eval_corpus.jsonl"

[tool.uv.sources]
en-core-web-sm = { url = "https://github.com/explosion/spacy-models/releases/download/en_core_web_sm-3.8.0/en_core_web_sm-3.8.0-py3-none-any.whl" }
en-core-web-lg = { url = "https://github.com/explosion/spacy-models/releases/download/en_core_web_lg-3.8.0/en_core_web_lg-3.8.0-py3-none-any.whl" }
en-core-web-trf = { url = "https://github.com/explosion/spacy-models/releases/download/en_core_web_trf-3.8.0/en_core_web_trf-3.8.0-py3-none-any.whl" }

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "ruff>=0.14.0",
    "mypy>=1.18.0",
    # Fast spaCy model for CI/tests; production default remains en-core-web-lg.
    "en-core-web-sm",
]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
packages = ["auscult"]
mypy_path = "src"
strict = true
warn_return_any = true
warn_unused_configs = true

[[tool.mypy.overrides]]
module = [
    "presidio_analyzer.*",
    "presidio_anonymizer.*",
    "faker.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
